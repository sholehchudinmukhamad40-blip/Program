    <title>Dashboard - Sistem Ketertiban Siswa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">

                <div class="user-info">
                    <span id="userRole"></span>
                    <button id="logoutBtn" class="btn-secondary">Keluar</button>

            </div>
        </header>
        
        <nav class="sidebar">
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active" data-page="dashboard">Dashboard</a></li>

            <!-- Konten halaman akan dimuat di sini -->
            <div id="pageContent" class="page-content">

                    <h2>Selamat Datang di Sistem Ketertiban Siswa</h2>
                    <p>Gunakan menu di samping untuk mengakses fitur aplikasi.</p>

            </div>
